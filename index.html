<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15120f" />
  <title>Skeleton Mining CO.</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PROTOTYPE</p>
        <h1>Skeleton Mining CO.</h1>
      </div>
      <div class="stats">
        <div><span>Level</span><strong id="levelStat">1</strong></div>
        <div><span>Gold</span><strong id="goldStat">0</strong></div>
        <div><span>Time</span><strong id="timeStat">45.0</strong></div>
      </div>
    </header>

    <section class="mine-card">
      <div class="mine-toolbar">
        <div>
          <strong id="levelTitle">Level 1</strong>
          <span id="levelGoal">Find the Golden Key before time runs out.</span>
        </div>
        <div class="placement-actions">
          <button id="endAttemptButton" disabled>End Attempt</button>
          <button id="startButton" class="primary">Start Mining</button>
        </div>
      </div>

      <div class="ore-strip">
        <strong>Active Ores</strong>
        <div id="oreLegend" class="ore-legend"></div>
      </div>

      <div class="canvas-wrap">
        <canvas id="mineCanvas" width="1400" height="900" aria-label="Mine play area"></canvas>
        <div id="messageOverlay" class="message-overlay hidden"></div>
      </div>

      <div class="placement-row">
        <div>
          <strong>Deployment</strong>
          <span id="placementHint">Tap the mine to place Skeleton 1.</span>
        </div>
        <div class="placement-actions">
          <button id="undoButton">Undo</button>
          <button id="resetPlacementButton">Reset</button>
        </div>
      </div>
    </section>

    <section class="control-grid">
      <section class="panel-section">
        <div class="section-heading">
          <h2>Crew</h2>
          <span id="crewCount">2 standard</span>
        </div>
        <div id="crewList" class="crew-list"></div>
      </section>

      <section class="panel-section">
        <div class="section-heading">
          <h2>Specialists</h2>
          <span>Purchase & train</span>
        </div>
        <div id="specialistList" class="specialist-list"></div>
      </section>

      <section class="panel-section">
        <div class="section-heading">
          <h2>Upgrades</h2>
          <button id="resetSaveButton" class="danger-link">New Playthrough</button>
        </div>
        <div id="upgradeList" class="upgrade-list"></div>
      </section>

      <section class="panel-section levels-panel">
        <div class="section-heading">
          <h2>Levels</h2>
          <span>20 levels</span>
        </div>
        <div id="levelButtons" class="level-buttons"></div>
      </section>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
