name: Skeleton Mining Co. tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gameplay-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run legacy prototype regression tests
        run: node tests/prototype.test.cjs
      - name: Audit live modular build
        run: node tests/live-build-audit.test.cjs
