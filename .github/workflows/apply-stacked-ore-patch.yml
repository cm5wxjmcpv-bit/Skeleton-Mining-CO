name: Apply stacked ore patch

on:
  push:
    branches:
      - agent/stacked-ore-progression

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ore-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply game patch
        run: python scripts/apply_stacked_ore_patch.py
      - name: Run gameplay tests
        run: node tests/prototype.test.cjs
      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          if git diff --cached --quiet; then
            echo "No game changes to commit"
            exit 0
          fi
          git commit -m "Implement stacked ore progression [ore-patch-applied]"
          git push
